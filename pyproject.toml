[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iqgram"
version = "0.1.0"
description = "IQGram: MTProto transfer toolkit for Telegram bots and user sessions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "IQGram contributors"}]
dependencies = ["wzgram==3.1.1"]
keywords = ["telegram", "mtproto", "upload", "download", "benchmark"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
fast = ["uvloop>=0.21.0; sys_platform != 'win32'"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
iqgram = "iqgram.cli:main"

[tool.setuptools.packages.find]
include = ["iqgram*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
